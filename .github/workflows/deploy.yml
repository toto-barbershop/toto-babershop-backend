name: CI/CD Pipeline - Test & Deploy to VPS

on:
  push:
    branches:
      - main       # Hoặc develop tùy nhánh chính bạn đang dùng
      - develop

jobs:
  # ==========================================
  # GIAI ĐOẠN 1: KIỂM THỬ TỰ ĐỘNG (CI)
  # ==========================================
  test:
    name: Run Automated Tests & Typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check TypeScript Syntax
        run: npx tsc --noEmit

      - name: Run Dependency Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run Trivy Vulnerability & Secret Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0' # Cảnh báo log không làm đứt đoạn deploy trừ khi có lỗi nghiêm trọng

      - name: Run Vitest Unit Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shop_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/shop_test?schema=public"
          JWT_SECRET: "test-secret"
          PAYOS_CLIENT_ID: "test-id"
          PAYOS_API_KEY: "test-key"
          PAYOS_CHECKSUM_KEY: "test-checksum"
        run: npm test -- --run

  # ==========================================
  # GIAI ĐOẠN 2: TỰ ĐỘNG DEPLOY LÊN VPS (CD)
  # (Chỉ chạy khi giai đoạn Test ở trên thành công 100%)
  # ==========================================
  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      # ==========================================
      # BƯỚC 1: BACKUP DB TRƯỚC KHI DEPLOY & BẢO MẬT
      # ==========================================
      - name: 1. Pre-Deploy Database Backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            cd ~/app

            # 1. Dọn dẹp các bản backup pre-deploy cũ hơn 14 ngày
            mkdir -p ~/backups/pre-deploy
            find ~/backups/pre-deploy -type f -name "backup_*.sql" -mtime +14 -delete 2>/dev/null || true

            # 2. Tạo bản backup Production DB với timestamp
            BACKUP_FILE=~/backups/pre-deploy/backup_$(date +%Y%m%d_%H%M%S).sql
            echo "::notice::Bắt đầu sao lưu Production DB trước khi deploy: $BACKUP_FILE"
            docker compose exec -T db pg_dump -U postgres totodb > "$BACKUP_FILE"

            # 3. Bảo mật file backup ngay lập tức (chmod 600 - chỉ owner có quyền đọc)
            chmod 600 "$BACKUP_FILE"

            # 4. Kiểm tra tính toàn vẹn cơ bản: File không được rỗng và chứa header PostgreSQL dump
            if [ ! -s "$BACKUP_FILE" ] || ! grep -q "PostgreSQL database dump" "$BACKUP_FILE"; then
              echo "::error::CRITICAL: Pre-deploy database backup thất bại hoặc file rỗng! Dừng pipeline ngay lập tức."
              rm -f "$BACKUP_FILE"
              exit 1
            fi

            # 5. Lưu đường dẫn chính xác vào con trỏ file để các bước sau đọc chính xác 100%
            echo "$BACKUP_FILE" > ~/backups/pre-deploy/LATEST_BACKUP_PATH.txt
            chmod 600 ~/backups/pre-deploy/LATEST_BACKUP_PATH.txt

            BACKUP_SIZE=$(ls -lh "$BACKUP_FILE" | awk '{print $5}')
            echo "========================================================"
            echo " PRE-DEPLOY BACKUP THÀNH CÔNG"
            echo " File: $BACKUP_FILE"
            echo " Dung lượng: $BACKUP_SIZE"
            echo " Quyền: 600 (Chỉ owner)"
            echo "========================================================"

      # ==========================================
      # BƯỚC 2: DEPLOY LÊN VPS (LƯU COMMIT, PULL & BUILD)
      # ==========================================
      - name: 2. Deploy to VPS (Git Pull & Docker Build)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e
            cd ~/app
            git config core.fileMode false

            # 1. Ghi lại commit đang chạy ổn định TRƯỚC KHI git pull (phục vụ rollback chuẩn xác)
            git rev-parse HEAD > ~/backups/pre-deploy/LAST_GOOD_COMMIT.txt
            chmod 600 ~/backups/pre-deploy/LAST_GOOD_COMMIT.txt
            echo "Commit ổn định hiện tại: $(cat ~/backups/pre-deploy/LAST_GOOD_COMMIT.txt)"

            # 2. Kéo code mới (dùng fetch + reset --hard để đảm bảo đồng bộ sạch sẽ 100%)
            git fetch origin main
            git reset --hard origin/main

            # 3. Áp dụng migration một cách tường minh trước khi khởi chạy backend.
            # Service backend-migrate là one-shot nên Docker Compose có thể giữ container
            # đã hoàn tất từ lần deploy trước và không chạy migration mới.
            # Dùng đúng DATABASE_URL mà API runtime dùng; DIRECT_URL cấu hình sai có thể
            # khiến migration thành công trên một database khác với database API phục vụ.
            docker compose run --rm backend sh -c 'DIRECT_URL="$DATABASE_URL" npx prisma migrate deploy'

            # 4. Khởi chạy và build các service
            docker compose up -d --build backend
            docker compose up -d pg-backup

      # ==========================================
      # BƯỚC 3: HEALTH CHECK & ROLLBACK NẾU THẤT BẠI
      # ==========================================
      - name: 3. Post-Deploy Health Check & Auto-Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 60s
          command_timeout: 10m
          script: |
            cd ~/app
            echo "========================================================"
            echo " KIỂM TRA HEALTH CHECK BACKEND TẠI http://localhost:5000/health"
            echo "========================================================"

            # Đợi 5s cho container khởi động hoàn toàn
            sleep 5

            # Thử gọi tối đa 5 lần (mỗi lần cách nhau 3s, tổng ~15-20s)
            HEALTH_OK=false
            for i in $(seq 1 5); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health || echo "000")
              if [ "$HTTP_CODE" -eq 200 ]; then
                HEALTH_OK=true
                break
              fi
              echo "Lần $i/5: Backend chưa sẵn sàng (HTTP code: $HTTP_CODE), chờ 3s..."
              sleep 3
            done

            if [ "$HEALTH_OK" = true ]; then
              echo "========================================================"
              echo " HEALTH CHECK THÀNH CÔNG (HTTP 200) - SERVER & DB HOẠT ĐỘNG TỐT"
              echo "========================================================"
            else
              echo "::error::CRITICAL: Health check thất bại sau 5 lần thử (HTTP code: $HTTP_CODE)! Tiến hành rollback tự động ngay..."
              bash ~/app/scripts/rollback.sh
              exit 1
            fi

      # ==========================================
      # BƯỚC 4: XÁC MINH PRISMA MIGRATION & ROLLBACK NẾU LỖI
      # ==========================================
      - name: 4. Verify Prisma Migration Status & Auto-Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 60s
          command_timeout: 10m
          script: |
            cd ~/app
            echo "========================================================"
            echo " KIỂM TRA TRẠNG THÁI PRISMA MIGRATION TRÊN PRODUCTION"
            echo "========================================================"

            if docker compose run --rm backend sh -c 'DIRECT_URL="$DATABASE_URL" npx prisma migrate status'; then
              echo "========================================================"
              echo " PRISMA MIGRATION HOÀN TẤT & DATABASE SCHEMA KHỚP 100%"
              echo "========================================================"
            else
              echo "::error::CRITICAL: Phát hiện lỗi migration hoặc schema drift! Tiến hành rollback tự động ngay..."
              bash ~/app/scripts/rollback.sh
              exit 1
            fi

      # ==========================================
      # BƯỚC 5: KIỂM TRA LUỒNG CMS LOOKBOOK THẬT
      # ==========================================
      - name: 5. Lookbook API Smoke Check & Auto-Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 60s
          command_timeout: 10m
          script: |
            cd ~/app
            LOOKBOOK_RESPONSE=$(curl -fsS http://localhost:5000/api/lookbooks) || {
              echo "::error::CRITICAL: Lookbook API không trả HTTP 200 sau deploy."
              docker compose logs --tail=100 backend | grep -E 'Không thể tải Lookbook|Lookbook|Prisma' || true
              bash ~/app/scripts/rollback.sh
              exit 1
            }

            if [ "$LOOKBOOK_RESPONSE" = "[]" ]; then
              echo "::error::CRITICAL: Lookbook API trả mảng rỗng sau deploy."
              docker compose logs --tail=100 backend | grep -E 'Không thể tải Lookbook|Lookbook|Prisma' || true
              bash ~/app/scripts/rollback.sh
              exit 1
            fi

            echo "Lookbook API smoke check thành công."
