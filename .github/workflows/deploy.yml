name: CI/CD Pipeline - Test & Deploy to VPS

on:
  push:
    branches:
      - main       # Hoặc develop tùy nhánh chính bạn đang dùng
      - develop

jobs:
  # ==========================================
  # GIAI ĐOẠN 1: KIỂM THỬ TỰ ĐỘNG (CI)
  # ==========================================
  test:
    name: Run Automated Tests & Typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check TypeScript Syntax
        run: npx tsc --noEmit

      - name: Run Dependency Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run Trivy Vulnerability & Secret Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0' # Cảnh báo log không làm đứt đoạn deploy trừ khi có lỗi nghiêm trọng

      - name: Run Vitest Unit Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shop_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/shop_test?schema=public"
          JWT_SECRET: "test-secret"
          PAYOS_CLIENT_ID: "test-id"
          PAYOS_API_KEY: "test-key"
          PAYOS_CHECKSUM_KEY: "test-checksum"
        run: npm test -- --run

  # ==========================================
  # GIAI ĐOẠN 2: TỰ ĐỘNG DEPLOY LÊN VPS (CD)
  # (Chỉ chạy khi giai đoạn Test ở trên thành công 100%)
  # ==========================================
  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 60s
          command_timeout: 30m
          script: |
            cd ~/app
            git pull origin main
            docker compose up -d --build backend
            docker compose up -d pg-backup