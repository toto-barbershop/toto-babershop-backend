name: CI/CD Pipeline - Test & Deploy to VPS

on:
  push:
    branches:
      - main       # Hoặc develop tùy nhánh chính bạn đang dùng
      - develop

jobs:
  # ==========================================
  # GIAI ĐOẠN 1: KIỂM THỬ TỰ ĐỘNG (CI)
  # ==========================================
  test:
    name: Run Automated Tests & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check TypeScript Syntax
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"
          JWT_SECRET: "test-secret"
          PAYOS_CLIENT_ID: "test-id"
          PAYOS_API_KEY: "test-key"
          PAYOS_CHECKSUM_KEY: "test-checksum"
        run: npm test -- --run

  # ==========================================
  # GIAI ĐOẠN 2: TỰ ĐỘNG DEPLOY LÊN VPS (CD)
  # (Chỉ chạy khi giai đoạn Test ở trên thành công 100%)
  # ==========================================
  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ~/app
            git pull origin ${{ github.ref_name }}
            docker compose up -d --build backend
            docker compose exec backend npx prisma db push