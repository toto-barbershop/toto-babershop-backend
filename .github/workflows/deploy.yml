name: CI/CD Pipeline - Test & Deploy to VPS

on:
  push:
    branches:
      - main       # Hoặc develop tùy nhánh chính bạn đang dùng
      - develop

jobs:
  # ==========================================
  # GIAI ĐOẠN 1: KIỂM THỬ TỰ ĐỘNG (CI)
  # ==========================================
  test:
    name: Run Automated Tests & Typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check TypeScript Syntax
        run: npx tsc --noEmit

      - name: Run Dependency Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run Trivy Vulnerability & Secret Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0' # Cảnh báo log không làm đứt đoạn deploy trừ khi có lỗi nghiêm trọng

      - name: Run Vitest Unit Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shop_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/shop_test?schema=public"
          JWT_SECRET: "test-secret"
          PAYOS_CLIENT_ID: "test-id"
          PAYOS_API_KEY: "test-key"
          PAYOS_CHECKSUM_KEY: "test-checksum"
        run: npm test -- --run

  # ==========================================
  # GIAI ĐOẠN 2: TỰ ĐỘNG DEPLOY LÊN VPS (CD)
  # (Chỉ chạy khi giai đoạn Test ở trên thành công 100%)
  # ==========================================
  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      # ==========================================
      # BƯỚC 1: BACKUP DB, BẢO MẬT & XÁC THỰC RESTORE
      # ==========================================
      - name: 1. Pre-Deploy Database Backup & Verification
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            cd ~/app

            # 1. Cảnh báo dung lượng ổ đĩa nếu phân vùng backup dùng trên 80%
            mkdir -p ~/backups/pre-deploy
            DISK_USAGE=$(df -P ~/backups/pre-deploy | awk 'NR==2 {print $5}' | tr -d '%')
            if [ "$DISK_USAGE" -gt 80 ]; then
              echo "::warning::CẢNH BÁO DUNG LƯỢNG Ổ ĐĨA: Phân vùng chứa backup đã sử dụng ${DISK_USAGE}% (>80%). Vui lòng dọn dẹp hoặc nâng cấp dung lượng VPS."
            else
              echo "Dung lượng ổ đĩa phân vùng backup: ${DISK_USAGE}% (An toàn)"
            fi

            # 2. Dọn dẹp các bản backup pre-deploy cũ hơn 14 ngày (giữ đúng logic có sẵn)
            find ~/backups/pre-deploy -type f -name "backup_*.sql" -mtime +14 -delete 2>/dev/null || true

            # 3. Tạo bản backup Production DB với timestamp
            BACKUP_FILE=~/backups/pre-deploy/backup_$(date +%Y%m%d_%H%M%S).sql
            echo "::notice::Bắt đầu sao lưu Production DB trước khi deploy: $BACKUP_FILE"
            docker compose exec -T db pg_dump -U postgres totodb > "$BACKUP_FILE"

            # 4. Bảo mật file backup ngay lập tức: chỉ user sở hữu được đọc/ghi (chmod 600)
            chmod 600 "$BACKUP_FILE"

            # 5. Kiểm tra tính toàn vẹn: File không được rỗng và phải chứa header dump PostgreSQL hợp lệ
            if [ ! -s "$BACKUP_FILE" ] || ! grep -q "PostgreSQL database dump" "$BACKUP_FILE"; then
              echo "::error::CRITICAL: Pre-deploy database backup thất bại hoặc file rỗng! Dừng pipeline ngay lập tức."
              rm -f "$BACKUP_FILE"
              exit 1
            fi

            # 6. Xác thực backup có thể restore được: thử restore vào DB tạm 'backup_verify_test'
            echo "--> Đang xác thực khả năng restore vào DB tạm 'backup_verify_test'..."
            docker compose exec -T db psql -U postgres -c "DROP DATABASE IF EXISTS backup_verify_test;" > /dev/null
            docker compose exec -T db psql -U postgres -c "CREATE DATABASE backup_verify_test;" > /dev/null

            if docker compose exec -T db psql -U postgres -d backup_verify_test < "$BACKUP_FILE" > /dev/null 2>&1; then
              echo "--> Xác thực restore thành công 100%! Dọn dẹp database tạm..."
              docker compose exec -T db psql -U postgres -c "DROP DATABASE backup_verify_test;" > /dev/null
            else
              echo "::error::CRITICAL: File backup không thể phục hồi (Restore verification failed)! Dừng pipeline ngay lập tức."
              docker compose exec -T db psql -U postgres -c "DROP DATABASE IF EXISTS backup_verify_test;" 2>/dev/null || true
              rm -f "$BACKUP_FILE"
              exit 1
            fi

            # 7. Lưu đường dẫn chính xác vào file pointer để các step sau (health check, verify migration) sử dụng
            echo "$BACKUP_FILE" > ~/backups/pre-deploy/LATEST_BACKUP_PATH.txt
            chmod 600 ~/backups/pre-deploy/LATEST_BACKUP_PATH.txt

            BACKUP_SIZE=$(ls -lh "$BACKUP_FILE" | awk '{print $5}')
            echo "========================================================"
            echo " PRE-DEPLOY BACKUP THÀNH CÔNG & ĐÃ ĐƯỢC XÁC THỰC RESTORE"
            echo " File: $BACKUP_FILE"
            echo " Dung lượng: $BACKUP_SIZE"
            echo " Quyền: 600 (Owner only)"
            echo "========================================================"

      # ==========================================
      # BƯỚC 2 (GIỮ NGUYÊN): PULL CODE & BUILD SERVICES
      # ==========================================
      - name: 2. Deploy to VPS (Git Pull & Docker Build)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 60s
          command_timeout: 30m
          script: |
            cd ~/app
            git pull origin main
            chmod +x ~/app/scripts/rollback.sh 2>/dev/null || true
            docker compose up -d --build backend
            docker compose up -d pg-backup

      # ==========================================
      # BƯỚC 3 (MỚI): HEALTH CHECK & ROLLBACK NẾU THẤT BẠI
      # ==========================================
      - name: 3. Post-Deploy Health Check & Auto-Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 60s
          command_timeout: 10m
          script: |
            cd ~/app
            echo "========================================================"
            echo " KIỂM TRA HEALTH CHECK BACKEND TẠI http://localhost:5000/health"
            echo "========================================================"

            HEALTH_OK=false
            for i in $(seq 1 10); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health || echo "000")
              if [ "$HTTP_CODE" -eq 200 ]; then
                HEALTH_OK=true
                break
              fi
              echo "Lần $i/10: Backend chưa sẵn sàng (HTTP code: $HTTP_CODE), chờ 3s..."
              sleep 3
            done

            if [ "$HEALTH_OK" = true ]; then
              echo "========================================================"
              echo " HEALTH CHECK THÀNH CÔNG (HTTP 200) - SERVER & DB KẾT NỐI TỐT"
              echo "========================================================"
            else
              echo "::error::CRITICAL: Health check thất bại sau 30s (HTTP $HTTP_CODE)! Tiến hành rollback tự động ngay..."
              bash ~/app/scripts/rollback.sh
              exit 1
            fi

      # ==========================================
      # BƯỚC 4: XÁC MINH PRISMA MIGRATION & ROLLBACK NẾU LỖI
      # ==========================================
      - name: 4. Verify Prisma Migration Status & Auto-Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 60s
          command_timeout: 10m
          script: |
            cd ~/app
            echo "========================================================"
            echo " KIỂM TRA TRẠNG THÁI PRISMA MIGRATION TRÊN PRODUCTION"
            echo "========================================================"

            if docker compose run --rm backend npx prisma migrate status; then
              echo "========================================================"
              echo " PRISMA MIGRATION HOÀN TẤT & DATABASE SCHEMA KHỚP 100%"
              echo "========================================================"
            else
              echo "::error::CRITICAL: Phát hiện lỗi migration hoặc lệch schema (schema drift)! Tiến hành rollback tự động ngay..."
              bash ~/app/scripts/rollback.sh
              exit 1
            fi