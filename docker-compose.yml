services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: totodb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/totodb?schema=public&connection_limit=20"
      REDIS_URL: "redis://redis:6379"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma db push --accept-data-loss && npx prisma db seed && npm run start"
    volumes:
      - uploads_data:/app/public/uploads

  pg-backup:
    image: eeshugerman/postgres-backup-s3:15
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - POSTGRES_HOST=db
      - POSTGRES_DATABASE=totodb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - S3_REGION=auto
      - S3_PREFIX=db-backup
      - S3_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - S3_BUCKET=${R2_BUCKET_NAME}
      - S3_ENDPOINT=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
      - S3_S3V4=yes

volumes:
  postgres_data:
  uploads_data:
  redis_data:
